<text x='200.0' y='137.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>C(χ): rotation about x</text>
<rect x='30.0' y='158.0' width='150.0' height='38.0' rx='6' stroke='#555555' stroke-width='2' fill='#ffffff'/>
<text x='105.0' y='183.0' fill='#555555' font-size='16' text-anchor='middle' font-weight='bold' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>wedge</text>
<text x='200.0' y='183.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>W: rotation about y</text>
<rect x='30.0' y='204.0' width='150.0' height='38.0' rx='6' stroke='#555555' stroke-width='2' fill='#ffffff'/>
<text x='105.0' y='229.0' fill='#555555' font-size='16' text-anchor='middle' font-weight='bold' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>dty</text>
<text x='200.0' y='229.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>translation along y by dty − y<tspan baseline-shift='sub' font-size='72%'>0</tspan></text>
<rect x='30.0' y='250.0' width='150.0' height='38.0' rx='6' stroke='#222222' stroke-width='2' fill='#eeeeee'/>
<text x='105.0' y='275.0' fill='#222222' font-size='16' text-anchor='middle' font-weight='bold' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>floor</text>
<text x='200.0' y='275.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>lab frame</text>
<text x='560.0' y='120.0' fill='#222222' font-size='17' text-anchor='middle' font-weight='normal' font-style='italic' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>v<tspan baseline-shift='sub' font-size='72%'>lab</tspan> = (0, dty − y<tspan baseline-shift='sub' font-size='72%'>0</tspan>, 0)</text>
<text x='560.0' y='150.0' fill='#222222' font-size='17' text-anchor='middle' font-weight='normal' font-style='italic' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>+ W C R(ω) v<tspan baseline-shift='sub' font-size='72%'>s</tspan></text>
<text x='560.0' y='200.0' fill='#555555' font-size='13' text-anchor='middle' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>R acts first (innermost),</text>
<text x='560.0' y='220.0' fill='#555555' font-size='13' text-anchor='middle' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>so chi and wedge tilt the ω axis</text>

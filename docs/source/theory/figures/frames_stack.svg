<text x='105.0' y='45.0' fill='#1f5fbf' font-size='16' text-anchor='middle' font-weight='bold' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>sample</text>
<text x='200.0' y='45.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>sample frame: v<tspan baseline-shift='sub' font-size='72%'>s</tspan></text>
<rect x='30.0' y='66.0' width='150.0' height='38.0' rx='6' stroke='#1f5fbf' stroke-width='2' fill='#ffffff'/>
<text x='105.0' y='91.0' fill='#1f5fbf' font-size='16' text-anchor='middle' font-weight='bold' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>omega</text>
<text x='200.0' y='91.0' fill='#333333' font-size='14' text-anchor='start' font-weight='normal' font-style='normal' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'>R(ω): rotation about z</text>
<rect x='30.0' y='112.0' width='150.0' height='38.0' rx='6' stroke='#555555' stroke-width='2' fill='#ffffff'/>
